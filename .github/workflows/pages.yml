# Publishes the Mini Apps: docs/ at the site root and each plugins/<name>/web/ at /plugins/<name>/.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/plugins
          cp -r docs/. _site/
          for web in plugins/*/web; do
            [ -d "$web" ] && cp -r "$web" "_site/plugins/$(basename "$(dirname "$web")")"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
